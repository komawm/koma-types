name: Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - name: Resolve and check release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          repo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("repo.toml", "rb"))["project"]["version"])')"
          artifact_version="$(python3 -c 'import tomllib; print(tomllib.load(open("artifact.toml", "rb"))["artifact"]["version"])')"
          if [[ "$REF_TYPE" == "tag" ]]; then
            version="${REF_NAME#v}"
          else
            version="$repo_version"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid release version '$version'"
            exit 1
          fi
          if [[ "$version" != "$repo_version" ]]; then
            echo "::error::version $version does not match repo.toml [project].version ($repo_version)"
            exit 1
          fi
          if [[ "$version" != "$artifact_version" ]]; then
            echo "::error::version $version does not match artifact.toml version ($artifact_version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Lua parser
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y lua5.4
      # Equivalent to `just check`; actionlint runs from the pinned image below.
      - name: Validate metadata, links, Lua syntax, and shell scripts
        run: just metadata links syntax shell
      - name: Lint GitHub workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          scripts/package-release.sh --version "$VERSION" --out release/assets
          (cd release/assets && sha256sum -c SHA256SUMS)
      - name: Write release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          revision="$(python3 -c 'import tomllib; print(tomllib.load(open("artifact.toml", "rb"))["artifact"]["source_revision"])')"
          {
            echo "Development prerelease of the Koma LuaLS definitions."
            echo
            echo "Snapshot generated by \`komactl gen-types\` at Koma source revision \`$revision\` (https://github.com/komawm/koma/commit/$revision)."
            echo
            awk -v header="## [$VERSION]" '
              index($0, header) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found && /^\[[^]]+\]: / { next }
              found { print }
            ' CHANGELOG.md
          } > release/notes.md
          if ! grep -q '[^[:space:]]' <(tail -n +4 release/notes.md); then
            echo "::error::CHANGELOG.md has no notes for $VERSION"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koma-types-release
          path: release/
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.ref_type == 'tag'
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: koma-types-release
          path: release
      - name: Verify checksums
        run: cd release/assets && sha256sum -c SHA256SUMS
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=(release/assets/koma-types-*.tar.gz release/assets/koma.lua release/assets/SHA256SUMS)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --prerelease \
              --verify-tag \
              --title "koma-types $TAG (development prerelease)" \
              --notes-file release/notes.md
          fi
